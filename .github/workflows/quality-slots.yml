# System1 quality slots, native mode (system1-quality v1.3.0, base-ci v2026.15).
# S2 Lint, L2 Runtime, L3 Integration, and P1 Package are declared `na` and stay skipped.
name: Quality slots

on:
  workflow_call:

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "26"
  PYTHON_VERSION: "3.12"
  NO_COLOR: "1"

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/starter/package-lock.json
      - name: Install starter dependencies
        working-directory: assets/starter
        run: npm ci
      - name: TypeScript check
        working-directory: assets/starter
        run: npm run typecheck
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    if: ${{ vars.ENABLE_S2_LINT == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A — no lint script configured in starter or root"

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified actionlint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run actionlint and verify immutable SHA pins
        run: |
          set -euo pipefail
          actionlint
          python3 - <<'PY'
          import pathlib, re, sys
          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              text = path.read_text(encoding="utf-8")
              for m in re.finditer(r"^\s*-?\s*uses:\s*([^\s#]+)", text, re.MULTILINE):
                  ref = m.group(1)
                  if ref.startswith("./") or ref.startswith("docker://"):
                      continue
                  sha = ref.split("@", 1)[1] if "@" in ref else ""
                  if not re.fullmatch(r"[0-9a-f]{40}", sha):
                      print(f"Unpinned action in {path}: {ref}", file=sys.stderr)
                      sys.exit(1)
          print("All external action references are pinned to 40-char SHAs.")
          PY
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-security-scanners@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          gitleaks: true
          osv-scanner: false
      - name: Scan checkout for secrets
        run: gitleaks dir . --no-banner --redact --log-level error
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-security-scanners@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          gitleaks: false
          osv-scanner: true
      - name: Scan starter lockfile vulnerabilities
        run: osv-scanner scan --lockfile=assets/starter/package-lock.json
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/starter/package-lock.json
      - name: Install starter dependencies
        working-directory: assets/starter
        run: npm ci
      - name: Build starter
        working-directory: assets/starter
        run: npm run build
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit:
    name: "L1: Unit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/starter/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify independent project creation
        run: python3 -m unittest discover -s tests
      - name: Install starter dependencies
        working-directory: assets/starter
        run: npm ci
      - name: Run starter unit tests
        working-directory: assets/starter
        run: |
          npm test
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2_RUNTIME == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A — no separate platform runtime binding"

  l3-integration:
    name: "L3: Integration"
    if: ${{ vars.ENABLE_L3_INTEGRATION == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A — no service API or database boundary"

  l4-e2e:
    name: "L4: E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: assets/starter/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install starter dependencies and cached example audio
        working-directory: assets/starter
        run: |
          npm ci
          npm run voice
          npm run sound
          npx remotion browser ensure
      - name: Render WebGL frames and real presentations
        working-directory: assets/starter
        env:
          RENDER_CONCURRENCY: '1'
          RENDER_GL: swangle
        run: |
          node scripts/render.mjs sample 300,311
          npm run slides
          uv run --python 3.12 scripts/slides.py verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: render-and-slides
          path: |
            assets/starter/verification/
            assets/starter/public/slides/
            assets/starter/process/renders/*/transition.mp4
            assets/starter/process/renders/*/render.json
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  p1-package:
    name: "P1: Package"
    if: ${{ vars.ENABLE_P1_PACKAGE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A — skill/starter repository; no npm package published"

  z1-gate:
    name: "Z1: Gate"
    if: always()
    needs:
      - s1-types
      - s2-lint
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - l1-unit
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Validate all quality slots and tested SHAs
        id: gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          expected_sha = os.environ["EXPECTED_SHA"]
          impl_slots = ["s1-types", "s3-workflow", "g1-secrets", "g2-dependencies", "b1-build", "l1-unit", "l4-e2e"]
          na_slots = ["s2-lint", "l2-runtime", "l3-integration", "p1-package"]
          errors = []
          for slot in impl_slots:
              entry = needs.get(slot, {})
              if entry.get("result") != "success":
                  errors.append(f"impl slot {slot} result is {entry.get('result', 'missing')}")
              elif entry.get("outputs", {}).get("tested-sha") != expected_sha:
                  errors.append(f"impl slot {slot} tested-sha ({entry.get('outputs', {}).get('tested-sha')}) != {expected_sha}")
          for slot in na_slots:
              entry = needs.get(slot, {})
              if entry.get("result") != "skipped":
                  errors.append(f"na slot {slot} expected skipped, got {entry.get('result', 'missing')}")
          if errors:
              print("Z1 Gate failed:\n" + "\n".join(f"  - {e}" for e in errors), file=sys.stderr)
              sys.exit(1)
          print(f"Z1 Gate passed: {len(impl_slots)} impl slots succeeded on {expected_sha}, {len(na_slots)} na slots skipped.")
          PY
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
